<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#111318"/>
  <text x="64" y="82" fill="#edf0f4" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">5. 추천 반복 루틴</text>
  <text x="64" y="121" fill="#9aa4b2" font-family="Segoe UI, Arial, sans-serif" font-size="21">Dongsan은 한 번에 끝내는 도구보다, 씬별로 생성과 수정을 반복하는 작업대에 가깝습니다.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">
    <circle cx="250" cy="315" r="110" fill="#181b22" stroke="#57b8a7" stroke-width="3"/>
    <text x="188" y="305" fill="#57b8a7">생성</text>
    <text x="172" y="342" fill="#edf0f4" font-size="17" font-weight="400">이미지 후보 만들기</text>
    <path d="M365 315 C450 220 560 220 645 315" fill="none" stroke="#57b8a7" stroke-width="5" marker-end="url(#arrow)"/>
    <circle cx="760" cy="315" r="110" fill="#181b22" stroke="#f0bb61" stroke-width="3"/>
    <text x="698" y="305" fill="#f0bb61">검토</text>
    <text x="680" y="342" fill="#edf0f4" font-size="17" font-weight="400">좋은 점과 문제점 보기</text>
    <path d="M760 430 C700 560 350 560 250 430" fill="none" stroke="#f0bb61" stroke-width="5" marker-end="url(#arrow2)"/>
    <circle cx="505" cy="520" r="92" fill="#181b22" stroke="#edf0f4" stroke-width="2"/>
    <text x="448" y="512" fill="#edf0f4">수정</text>
    <text x="420" y="546" fill="#9aa4b2" font-size="16" font-weight="400">태그 추가/삭제/가중치</text>
  </g>
  <rect x="930" y="210" width="270" height="305" rx="16" fill="#181b22" stroke="#2d3340"/>
  <text x="962" y="260" fill="#edf0f4" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">작업 팁</text>
  <text x="962" y="312" fill="#9aa4b2" font-family="Segoe UI, Arial, sans-serif" font-size="18">1. 씬별로 상태 색을 확인</text>
  <text x="962" y="354" fill="#9aa4b2" font-family="Segoe UI, Arial, sans-serif" font-size="18">2. 첫 생성은 빠르게</text>
  <text x="962" y="396" fill="#9aa4b2" font-family="Segoe UI, Arial, sans-serif" font-size="18">3. 좋은 이미지는 채택</text>
  <text x="962" y="438" fill="#9aa4b2" font-family="Segoe UI, Arial, sans-serif" font-size="18">4. 실패 이미지는 메모</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#57b8a7"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f0bb61"/></marker>
  </defs>
</svg>
