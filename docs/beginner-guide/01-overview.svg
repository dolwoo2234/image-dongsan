<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#111318"/>
  <rect x="48" y="42" width="1184" height="636" rx="22" fill="#181b22" stroke="#2d3340" stroke-width="2"/>
  <text x="84" y="104" fill="#edf0f4" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Dongsan 초보자 가이드</text>
  <text x="84" y="145" fill="#9aa4b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">TXT 씬 설명에서 이미지 생성, 프롬프트 재생성까지 한 번에 따라 하기</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">
    <rect x="84" y="215" width="240" height="116" rx="12" fill="#101218" stroke="#57b8a7"/>
    <text x="114" y="263" fill="#57b8a7">1. TXT 불러오기</text>
    <text x="114" y="299" fill="#edf0f4" font-size="16" font-weight="400">씬 설명 파일을 업로드</text>
    <path d="M342 273h52" stroke="#57b8a7" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="414" y="215" width="240" height="116" rx="12" fill="#101218" stroke="#57b8a7"/>
    <text x="444" y="263" fill="#57b8a7">2. 씬 선택</text>
    <text x="444" y="299" fill="#edf0f4" font-size="16" font-weight="400">왼쪽 목록에서 선택</text>
    <path d="M672 273h52" stroke="#57b8a7" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="744" y="215" width="240" height="116" rx="12" fill="#101218" stroke="#57b8a7"/>
    <text x="774" y="263" fill="#57b8a7">3. 태그 준비</text>
    <text x="774" y="299" fill="#edf0f4" font-size="16" font-weight="400">초안 생성, 순서 정리</text>
    <path d="M984 273h52" stroke="#57b8a7" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1048" y="215" width="140" height="116" rx="12" fill="#101218" stroke="#57b8a7"/>
    <text x="1074" y="263" fill="#57b8a7">4. 생성</text>
    <text x="1074" y="299" fill="#edf0f4" font-size="16" font-weight="400">첫 이미지</text>
    <rect x="250" y="424" width="300" height="128" rx="12" fill="#101218" stroke="#f0bb61"/>
    <text x="282" y="474" fill="#f0bb61">5. 프롬프트 수정</text>
    <text x="282" y="512" fill="#edf0f4" font-size="17" font-weight="400">태그 추가, 삭제, 가중치 조정</text>
    <path d="M568 488h90" stroke="#f0bb61" stroke-width="4" marker-end="url(#arrow2)"/>
    <rect x="680" y="424" width="350" height="128" rx="12" fill="#101218" stroke="#f0bb61"/>
    <text x="712" y="474" fill="#f0bb61">6. 해당 프롬프트로 재생성</text>
    <text x="712" y="512" fill="#edf0f4" font-size="17" font-weight="400">현재 최종 프롬프트를 반영</text>
  </g>
  <text x="84" y="630" fill="#9aa4b2" font-family="Segoe UI, Arial, sans-serif" font-size="18">핵심: 처음 생성한 이미지를 보고, 최종 프롬프트를 고친 뒤 재생성을 반복합니다.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#57b8a7"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f0bb61"/></marker>
  </defs>
</svg>
